<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Cadastro de imoveis</h1>
    <label for="campo-localidade">Digite a localidade do imovel</label>
    <input type="text" id="campo-localidade">
    <label for="campo-proprietario">Digite o Nome do proprietario</label>
    <input type="text" id="campo-proprietario">
    <label for="campo-valor">Digite o valor do Imovel</label>
    <input type="number" id="campo-valor">
    <label for="campo-quantidade-metros">Digite a quantidade de metros²</label>
    <input type="number" id="campo-quantidade-metros">
    <label for="campo-construcao">Possui construção?</label>
    <select id="campo-construcao">
        <option value=""disable selected>Selecione</option>
        <option value="sim">Sim</option>
        <option value="nao">Não</option>
    </select>


    <script src="assets/js/imoveis.js"></script>
</body>
</html>
