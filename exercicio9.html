<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Cadastro de Livros</title>
</head>

<body>

<h2>Cadastro de Livros</h2>

<label for="campo-titulo">Título do livro:</label>
<input type="text" id="campo-titulo"><br><br>
<label for="campo-autor">Autor:</label>
<input type="text" id="campo-autor"><br><br>
<label for="campo-paginas">Quantidade de páginas:</label>
<input type="number" id="campo-paginas"><br><br>
<label for="campo-ano">Ano de publicação:</label>
<input type="number" id="campo-ano"><br><br>

<button id="salvar">Salvar</button>

<h2>Lista de Livros</h2>

<table>
<thead>
<tr>
<th>Código</th>
<th>Título</th>
<th>Autor</th>
<th>Quantidade de páginas</th>
<th>Ano de publicação</th>
<th>Classificação</th>
</tr>
</thead>

<tbody id="tabela-livros">
</tbody>

</table>

<script src="assets/js/exercicio9.js"></script>

</body>
</html>
