<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="assets/css/exercicio7.css">
</head>

<body>

    <h2>Cadastro de Alunos</h2>

    <label for="campo-nome">Nome do aluno:</label>
    <input type="text" id="campo-nome"><br><br>
    <label for="campo-nota1">Nota 1:</label>
    <input type="number" id="campo-nota1"><br><br>
    <label for="campo-nota2">Nota 2:</label>
    <input type="number" id="campo-nota2"><br><br>
    <label for="campo-nota3">Nota 3:</label>
    <input type="number" id="campo-nota3"><br><br>
    <button id="salvar">Salvar</button>

    <h2>Lista de Alunos</h2>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Nome do aluno</th>
                <th>Nota 1</th>
                <th>Nota 2</th>
                <th>Nota 3</th>
                <th>Média final</th>
                <th>Situação</th>
            </tr>
        </thead>

        <tbody id="tabela-alunos">
        </tbody>

    </table>

    <script src="assets/js/exercicio7"></script>

</body>

</html>
