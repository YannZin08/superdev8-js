<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/exercicio6.css">
</head>
<body>
    <h2>Cadastro de produto</h2>

    <label for="campo-nome">Nome do produto:</label>
    <input type="text" id="campo-nome">
    <label for="campo-categoria">Categoria:</label>
    <input type="text" id="campo-categoria">
    <label for="campo-preco">Preço:</label>
    <input type="number" id="campo-preco">
    <label for="campo-quantidade">Quantidade em estoque</label>
    <input type="number" id="campo-quantidade">

    <button id="salvar">Salvar</button>
    
    <h2>Lista de Produtos</h2>

    <table>
        <thead>
            <tr>
            <th>Codigo</th>
            <th>Nome do produto</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Quantidade em estoque</th>
            <th>Valor total em estoque</th>
            </tr>
        </thead>
        <tbody id="tabela-produtos">
</tbody>
    </table>

    <script src="assets/js/exercicio6.js"></script>
</body>
</html>
