<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Veículos</title>
    <link rel="stylesheet" href="assets/css/exercicio5.css">
</head>

<body>
    <h2>Cadastro de Veículos</h2>

    <label>Modelo:</label>
    <input type="text" id="campo-modelo">
    <label>Marca:</label>
    <input type="text" id="campo-marca">
    <label>Ano:</label>
    <input type="number" id="campo-ano">
    <label>Valor do veículo:</label>
    <input type="number" id="campo-valor">
    <label>Quantidade de portas:</label>
    <input type="number" id="campo-portas">
    <button id="salvar">Salvar</button>

    <h2>Lista de Veículos</h2>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Modelo</th>
                <th>Marca</th>
                <th>Ano</th>
                <th>Valor</th>
                <th>Quantidade de portas</th>
                <th>Idade do veículo</th>
            </tr>
        </thead>

        <tbody id="tabela-veiculos">
    </table>
    </tbody>

    <script src="assets/js/exercicio5.js"></script>

</body>

</html>
